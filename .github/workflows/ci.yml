name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Verify runtime versions
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(yarn --version)" = "1.22.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Chromium
        run: yarn playwright install --with-deps --only-shell chromium

      - name: Run quality checks
        run: yarn quality
