<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Заумникъ — словарь любопытных слов</title>
  <desc id="description">Слова, которые интересно узнать.</desc>

  <defs>
