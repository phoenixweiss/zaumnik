letter: Ч
words:
  - name: Чучхе
    stress:
      - 5
    definition: >-
      Государственная идеология КНДР, сформулированная Ким Ир Сеном в середине 1950-х годов. Она
      подчёркивает политическую самостоятельность и опору страны на собственные силы, но не сводится
      только к самообеспечению: важное место в ней занимают особая роль вождя и представление о
      человеке как хозяине собственной судьбы.
