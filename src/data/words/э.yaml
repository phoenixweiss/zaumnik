letter: Э
words:
  - name: Эгида
    stress:
      - 3
    definition: >-
      Покровительство и защита влиятельной силы или организации. Выражение «под эгидой» восходит к
      мифическому щиту Зевса и Афины, а сегодня обычно говорит об официальной поддержке мероприятия
      или проекта.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эгрегор
    stress:
      - 4
      - 6
    definition: >-
      В эзотерических учениях — предполагаемая сущность или общее энергетическое поле, возникающее
      из мыслей и эмоций группы людей. Понятие относится к сфере мистических верований и не
      считается научно подтверждённым явлением.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эквилибриум
    stress:
      - 6
    definition: >-
      Состояние равновесия, в котором противоположные силы или влияния уравновешивают друг друга.
      Слово книжное и часто используется там, где обычное «баланс» показалось говорящему
      недостаточно торжественным.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экзальтированный
    stress:
      - 8
      - 10
    definition: >-
      Находящийся в состоянии чрезмерного эмоционального возбуждения и выражающий чувства особенно
      бурно. Экзальтированная речь легко поднимается до восторга, пафоса или драматизма даже по
      умеренному поводу.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экзистенциальный
    stress:
      - 11
    definition: >-
      Связанный с самим человеческим существованием, свободой, выбором, ответственностью и поиском
      смысла. Экзистенциальный вопрос затрагивает не просто текущую проблему, а то, как человек
      понимает собственную жизнь и место в мире.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экивоки
    stress:
      - 5
    definition: >-
      Двусмысленные намёки и уклончивые выражения, позволяющие не говорить прямо. Фраза «без
      экивоков» означает требование оставить словесные манёвры и назвать вещи своими именами.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эклектика
    stress:
      - 4
    definition: >-
      Соединение элементов разных стилей, учений или подходов в одном целом. Эклектика может дать
      выразительное сочетание, но без общего замысла легко превращается в случайный набор
      несовместимых деталей.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эксклюзивность
    stress:
      - 8
    definition: >-
      Исключительность или ограниченная доступность чего-либо для узкого круга. Эксклюзивность может
      быть реальным свойством, правом или условием доступа, а может оказаться всего лишь рекламным
      обещанием редкости.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экспансия
    stress:
      - 5
    definition: >-
      Расширение влияния, присутствия или территории за прежние пределы. Экспансия бывает военной,
      политической, экономической и культурной — общий смысл в движении наружу и занятии нового
      пространства.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экспликация
    stress:
      - 8
    definition: >-
      Развёрнутое объяснение, которое делает скрытый или неясный смысл явным. В разных областях
      экспликацией называют также пояснительный текст, перечень помещений на плане или раскрытие
      содержания понятия.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экспозиция
    stress:
      - 7
    definition: >-
      Вводная часть произведения, знакомящая с героями, обстоятельствами и исходным конфликтом. Тем
      же словом называют размещённую для показа выставку, а в фотографии — количество света,
      попавшего на светочувствительный материал.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экспорт
    stress:
      - 1
    definition: >-
      Вывоз товаров, услуг или технологий в другую страну для продажи или использования. В работе с
      программами экспортом называют сохранение данных во внешнем формате или передачу их в другую
      систему.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экспроприация
    stress:
      - 10
    definition: >-
      Принудительное лишение собственности, обычно по решению государственной власти. Она может
      проводиться с компенсацией или без неё, поэтому правовая оценка зависит от закона, процедуры и
      конкретных обстоятельств.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экстенсивный
    stress:
      - 8
    definition: >-
      Растущий за счёт увеличения количества используемых ресурсов, а не повышения их отдачи.
      Экстенсивное развитие добавляет людей, площади или сырьё; интенсивное старается получить
      больше из уже имеющегося.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экстраверт
    stress:
      - 8
    definition: >-
      Человек, чьё внимание и восстановление сил в большей степени направлены на внешний мир и
      взаимодействие с людьми. Экстраверсия не означает поверхностность или постоянную
      разговорчивость — это общая склонность, а не готовый портрет характера.
    synonyms: []
    antonyms: []
    relations: []
  - name: Экстраполяция
    stress:
      - 10
    definition: >-
      Продолжение обнаруженной закономерности за пределы уже известных данных. Такой прогноз
      полезен, пока условия остаются похожими, но становится рискованным, когда реальность меняется
      быстрее модели.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эксцесс
    stress:
      - 5
    definition: >-
      Крайнее проявление чего-либо или резкое происшествие, нарушающее нормальный ход событий.
      Несмотря на созвучие, эксцесс никак не связан с инцестом.
    synonyms: []
    antonyms: []
    relations: []
  - name: Электорат
    stress:
      - 8
    definition: >-
      Совокупность избирателей, которые могут голосовать или обычно поддерживают определённого
      кандидата, партию либо направление. Людей объединяют этим словом только в контексте выборов, а
      не как постоянную и однородную группу.
    synonyms: []
    antonyms: []
    relations: []
  - name: Элизиум
    stress:
      - 3
    definition: >-
      В древнегреческих представлениях — блаженная часть загробного мира, предназначенная для
      избранных героев и праведников. В переносной речи Элизиум становится образом безмятежного,
      почти райского места.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эмбарго
    stress:
      - 4
    definition: >-
      Официальный запрет на торговлю, поставки или другие операции с определённой страной, товаром
      либо участником. Эмбарго используют как средство политического и экономического давления.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эмерджентность
    stress:
      - 7
    definition: >-
      Появление у целой системы свойств, которых нет у её отдельных частей поодиночке. Эти свойства
      возникают из взаимодействия элементов: разобрать систему можно, но новое качество
      обнаруживается только в собранном виде.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эмпатия
    stress:
      - 4
      - 6
    definition: >-
      Способность понимать эмоциональное состояние другого человека и откликаться на него, не теряя
      различия между его переживаниями и своими. Эмпатия помогает услышать человека, но не требует
      соглашаться с каждым его выводом.
    synonyms: []
    antonyms: []
    relations: []
  - name: Энтропия
    stress:
      - 7
    definition: >-
      Физическая величина, связанная с числом возможных микросостояний системы и направлением
      необратимых процессов. В теории информации энтропия измеряет неопределённость, а бытовое
      понимание её как простого «беспорядка» удобно, но довольно приблизительно.
    synonyms: []
    antonyms: []
    relations: []
  - name: Энтузиазм
    stress:
      - 7
    definition: >-
      Сильная увлечённость делом, соединённая с энергией и готовностью действовать. Энтузиазм хорошо
      запускает работу, но для долгого пути ему обычно нужны план, навык и отдых.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эполет
    stress:
      - 5
    definition: >-
      Парадный наплечный знак различия на военной форме, часто украшенный бахромой. По форме он
      напоминает погон, но относится прежде всего к историческому и церемониальному обмундированию.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эскапада
    stress:
      - 6
    definition: >-
      Дерзкая, неожиданная выходка, нарушающая привычные правила и привлекающая внимание. Эскапада
      может быть эффектной и забавной, но слово обычно намекает на риск, легкомыслие или скандал.
    synonyms: []
    antonyms: []
    relations: []
  - name: Эшелон
    stress:
      - 5
    definition: >-
      Уровень в иерархии или часть сил, расположенная за другой частью и выполняющая свою задачу. В
      железнодорожной и военной речи эшелоном также называют организованный состав для перевозки
      людей и техники.
    synonyms: []
    antonyms: []
    relations: []
