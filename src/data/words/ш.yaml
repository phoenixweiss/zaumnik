letter: Ш
words:
  - name: Штрейкбрехер
    stress:
      - 9
    definition: >-
      Человек, который продолжает работу во время забастовки или занимает место бастующего и тем
      самым ослабляет коллективное давление работников. Слово почти всегда несёт резко отрицательную
      оценку со стороны участников забастовки.
    synonyms: []
    antonyms: []
    relations: []
  - name: Штрибан
    stress:
      - 6
    definition: >-
      Ненормативное жаргонное обозначение пожилого или просто неприятного мужчины. Значение заметно
      меняется между средами, а надёжной словарной фиксации у слова нет, поэтому употреблять его
      стоит лишь с пониманием грубой и оскорбительной окраски.
    synonyms: []
    antonyms: []
    relations: []
  - name: Штудировать
    stress:
      - 5
    definition: >-
      Тщательно и последовательно изучать книгу, документ или предмет. Штудировать — не пролистать
      по диагонали, а разбирать материал внимательно, возвращаясь к сложным местам.
    synonyms:
      - изучать
      - прорабатывать
    antonyms: []
    relations: []
