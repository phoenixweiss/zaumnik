letter: К
words:
  - name: Кабала
    stress:
      - 6
    definition: >-
      Тяжёлая зависимость, ставящая человека в почти бесправное положение. Первоначально слово было
      связано с долговыми обязательствами, поэтому в нём до сих пор слышится не просто ограничение,
      а подчинение кредитору или хозяину условий.
    synonyms:
      - зависимость
      - неволя
      - рабство
    antonyms: []
    relations: []
  - name: Каверза
    stress:
      - 2
    definition: >-
      Коварная уловка или неприятный подвох, рассчитанный на чужую ошибку. Каверзу устраивают
      намеренно, даже если внешне она выглядит как безобидная шутка или случайное затруднение.
    synonyms:
      - интрига
      - козни
      - подвох
    antonyms: []
    relations:
      - word: Каверзный
        type: related
  - name: Каверзный
    stress:
      - 2
    definition: >-
      Содержащий скрытый подвох либо неожиданную трудность. Каверзный вопрос проверяет не только
      знания, но и способность заметить ловушку в самой формулировке.
    synonyms:
      - заковыристый
      - коварный
    antonyms: []
    relations:
      - word: Каверза
        type: related
  - name: Каданс
    stress:
      - 2
    definition: >-
      Ритм и частота регулярно повторяющихся движений или событий. В спорте кадансом обычно называют
      число шагов, гребков или оборотов педалей за минуту.
    synonyms: []
    antonyms: []
    relations: []
  - name: Каденция
    stress:
      - 4
    definition: >-
      Завершающий мелодический или гармонический оборот, создающий ощущение остановки либо окончания
      музыкальной фразы. В речи слово иногда используют шире — для обозначения ритмического
      завершения.
    synonyms: []
    antonyms: []
    relations: []
  - name: Канитель
    stress:
      - 6
    definition: >-
      Долгое, утомительное занятие с множеством мелких хлопот и задержек. Изначально канителью
      называли тонкую металлическую нить для вышивки, изготовление которой требовало терпения и
      времени.
    synonyms:
      - волокита
      - маета
    antonyms: []
    relations: []
  - name: Канон
    stress:
      - 4
    definition: >-
      Установившееся правило или образец, которому принято следовать внутри учения, искусства или
      традиции. Канон задаёт границы допустимого: это может быть церковное установление, признанный
      состав священных книг или набор требований художественного направления. В музыке так называют
      форму, где голоса последовательно повторяют одну и ту же мелодию.
    synonyms:
      - норма
      - образец
      - правило
    antonyms: []
    relations:
      - word: Догма
        type: confused
  - name: Карт-бланш
    stress:
      - 7
    definition: >-
      Полная свобода действий и право самостоятельно выбирать средства для достижения цели. Получить
      карт-бланш — значит получить доверие без необходимости согласовывать каждый следующий шаг.
    synonyms:
      - полномочия
      - свобода действий
    antonyms: []
    relations: []
  - name: Катарсис
    stress:
      - 4
    definition: >-
      Сильное эмоциональное переживание, после которого приходит чувство очищения, освобождения или
      внутренней ясности. Понятие связано прежде всего с воздействием искусства и сопереживанием
      происходящему в нём.
    synonyms:
      - очищение
    antonyms: []
    relations: []
  - name: Катастрофа
    stress:
      - 8
    definition: >-
      Событие с тяжёлыми разрушительными последствиями для людей, природы или сложной системы. В
      повседневной речи слово часто преувеличивают, называя катастрофой любую крупную неудачу.
    synonyms:
      - бедствие
      - катаклизм
      - крушение
    antonyms: []
    relations: []
  - name: Квинтэссенция
    stress:
      - 9
    definition: >-
      Самая существенная, концентрированная часть чего-либо. Квинтэссенцией идеи называют то, что
      останется, если убрать подробности и сохранить её главный смысл.
    synonyms:
      - основа
      - суть
      - сущность
    antonyms: []
    relations: []
  - name: Кворум
    stress:
      - 3
    definition: >-
      Минимальное число участников, необходимое для того, чтобы собрание могло принимать
      действительные решения. Если кворума нет, обсуждать вопросы можно, а официально голосовать —
      уже нет.
    synonyms: []
    antonyms: []
    relations: []
  - name: Кисет
    stress:
      - 4
    definition: >-
      Небольшой мягкий мешочек с завязкой, обычно предназначенный для хранения табака. Кисеты часто
      делали из ткани или кожи и носили при себе.
    synonyms:
      - мешочек
    antonyms: []
    relations: []
  - name: Кичиться
    stress:
      - 4
    definition: >-
      Демонстративно выставлять напоказ свои достоинства, успехи или положение, подчёркивая
      превосходство над другими. Кичатся обычно чем-либо — происхождением, связями, знаниями, — и
      потому это слово говорит не столько о предмете гордости, сколько о высокомерной манере его
      предъявлять.
    synonyms:
      - бахвалиться
      - хвастаться
      - чваниться
    antonyms: []
    relations:
      - word: Сноб
        type: related
  - name: Когнитивный
    stress:
      - 7
    definition: >-
      Связанный с познанием — восприятием, вниманием, памятью, мышлением и обработкой информации.
      Когнитивные процессы описывают то, как человек получает знания и пользуется ими.
    synonyms:
      - познавательный
    antonyms: []
    relations:
      - word: Когнитивный диссонанс
        type: related
  - name: Когнитивный диссонанс
    stress:
      - 7
      - 18
    definition: >-
      Психологическое напряжение, возникающее при столкновении несовместимых убеждений, знаний или
      поступков. Чтобы уменьшить его, человек может пересмотреть мнение, изменить поведение или
      найти объяснение, которое примирит противоречие.
    synonyms: []
    antonyms: []
    relations:
      - word: Диссонанс
        type: related
      - word: Когнитивный
        type: related
  - name: Коллаборация
    stress:
      - 9
    definition: >-
      Совместная работа нескольких самостоятельных участников над общим результатом. Коллаборация
      предполагает реальный вклад сторон, а не простое появление двух имён рядом.
    synonyms: []
    antonyms: []
    relations: []
  - name: Коллапс
    stress:
      - 5
    definition: >-
      Резкий распад, обвал или прекращение нормальной работы системы. В медицине коллапсом называют
      опасное состояние с внезапным падением сосудистого тонуса и кровоснабжения жизненно важных
      органов.
    synonyms:
      - крах
      - разрушение
    antonyms: []
    relations: []
  - name: Колофон
    stress:
      - 6
    definition: >-
      Завершающая запись в рукописи или старинной книге со сведениями об авторе, переписчике, месте
      и времени создания. В современном издательском деле так иногда называют блок выходных данных.
    synonyms: []
    antonyms: []
    relations: []
  - name: Конвергентный
    stress:
      - 8
    definition: >-
      Сходящийся к общему результату или приобретающий сходные черты. Конвергентными могут быть
      линии развития, способы решения задачи или признаки неродственных организмов, возникшие в
      похожих условиях.
    synonyms:
      - сходящийся
    antonyms:
      - дивергентный
    relations: []
  - name: Конгломерат
    stress:
      - 10
    definition: >-
      Соединение разнородных частей, сохраняющих заметные различия внутри целого. В бизнесе
      конгломератом называют группу компаний из разных отраслей, объединённых общим владельцем.
    synonyms:
      - смесь
      - соединение
    antonyms: []
    relations: []
  - name: Коннотация
    stress:
      - 7
    definition: >-
      Дополнительный смысловой или эмоциональный оттенок, который слово получает сверх прямого
      значения. Слова «дом» и «жилище» могут указывать на одно место, но их коннотации заметно
      различаются.
    synonyms:
      - смысловой оттенок
      - сопутствующее значение
    antonyms: []
    relations:
      - word: Семантика
        type: related
  - name: Консолидация
    stress:
      - 9
    definition: >-
      Объединение и укрепление разрозненных частей ради общей устойчивости или цели. Консолидировать
      можно усилия, общественную группу, финансовую отчётность или долг — смысл уточняет контекст.
    synonyms:
      - объединение
      - сплочение
      - укрепление
    antonyms: []
    relations: []
  - name: Контаминация
    stress:
      - 9
    definition: >-
      Смешение или взаимное влияние разных элементов, при котором возникает новая форма. В
      лингвистике так появляются слова и выражения, соединяющие части двух близких конструкций.
    synonyms:
      - загрязнение
      - смешение
    antonyms: []
    relations: []
  - name: Конъюнктура
    stress:
      - 9
    definition: >-
      Сложившаяся в данный момент обстановка и совокупность взаимосвязанных условий в некоторой
      области. Особенно часто говорят о рыночной конъюнктуре — текущем состоянии спроса,
      предложения, цен и деловой активности.
    synonyms:
      - обстановка
      - ситуация
      - условия
    antonyms: []
    relations: []
  - name: Корпулентный
    stress:
      - 7
    definition: >-
      Крупный и полный по телосложению. Это книжное и несколько старомодное слово описывает
      внешность, но в зависимости от контекста может звучать как нарочито вежливая замена более
      прямому определению.
    synonyms:
      - дородный
      - полный
      - тучный
    antonyms:
      - субтильный
    relations:
      - word: Субтильный
        type: opposite
  - name: Корреляция
    stress:
      - 7
    definition: >-
      Статистическая связь между изменениями двух величин. Корреляция показывает, что признаки
      меняются согласованно, но сама по себе не доказывает, что один из них служит причиной другого.
    synonyms:
      - взаимосвязь
      - соотношение
    antonyms: []
    relations: []
  - name: Кортеж
    stress:
      - 5
    definition: >-
      Торжественная или официальная процессия из следующих друг за другом людей либо автомобилей. В
      математике кортежем называют упорядоченный набор элементов, где важны и состав, и
      последовательность.
    synonyms:
      - процессия
      - шествие
    antonyms: []
    relations: []
  - name: Крамольный
    stress:
      - 5
    definition: >-
      Направленный против господствующих взглядов, порядка или власти и потому воспринимаемый как
      опасный либо запретный. Сегодня слово часто употребляют полушутя о мысли, которая всего лишь
      выбивается из привычного согласия.
    synonyms:
      - запрещённый
      - мятежный
      - предосудительный
    antonyms: []
    relations:
      - word: Фронда
        type: related
  - name: Ксива
    stress:
      - 3
    definition: >-
      Жаргонное название документа, удостоверения или бумаги, дающей определённые полномочия. Слово
      пришло из уголовного арго и сохраняет грубоватую, неофициальную окраску.
    synonyms:
      - документ
      - удостоверение
    antonyms: []
    relations: []
