letter: Н
words:
  - name: Натиформа
    stress:
      - 6
    definition: >-
      Редкое и шутливое название природной формы, напоминающей человеческие ягодицы. Слово не
      закреплено в нормативных русских словарях и встречается главным образом в подборках необычных
      терминов.
    synonyms: []
    antonyms: []
    relations: []
  - name: Неглект
    stress:
      - 5
    definition: >-
      Систематическое пренебрежение базовыми потребностями человека, который зависит от заботы
      другого. В медицине тем же словом называют неврологическое нарушение, при котором пациент
      перестаёт замечать часть пространства или собственного тела.
    synonyms:
      - игнорирование
      - пренебрежение
    antonyms: []
    relations: []
  - name: Нигилизм
    stress:
      - 6
    definition: >-
      Позиция, отрицающая общепринятые ценности, авторитеты или основания знания и морали. Нигилизм
      бывает философским, политическим и бытовым, поэтому одного ярлыка недостаточно, чтобы понять,
      что именно человек отвергает.
    synonyms: []
    antonyms: []
    relations: []
