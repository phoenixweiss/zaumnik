letter: П
words:
  - name: Паритет
    stress: []
    definition: >-
      Равенство или устойчивое равновесие сторон по значимому показателю. Паритет может касаться
      прав, сил, голосов или стоимости — важно, что ни одна сторона не получает решающего перевеса.
    synonyms: []
    antonyms: []
    relations: []
  - name: Парнас
    stress: []
    definition: >-
      Гора в Греции, которая в античной традиции считалась местом Аполлона и муз. В переносном
      смысле Парнас — мир поэзии и поэтическое сообщество.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пастораль
    stress: []
    definition: >-
      Произведение или сцена, изображающие сельскую жизнь как спокойную, гармоничную и почти
      беззаботную. Пастораль интересуется не точностью деревенского быта, а его идеализированным
      образом.
    synonyms: []
    antonyms: []
    relations: []
  - name: Патернализм
    stress: []
    definition: >-
      Опека, при которой власть или более сильная сторона ограничивает самостоятельность людей,
      объясняя это заботой об их благе. Патерналистское решение может действительно защищать, но
      одновременно отнимает часть права выбирать и ошибаться.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пафос
    stress: []
    definition: >-
      Эмоциональный строй речи или произведения, выражающий возвышенную идею и сильное чувство. В
      быту пафосом часто называют чрезмерную торжественность, когда высота тона заметно превосходит
      масштаб повода.
    synonyms: []
    antonyms: []
    relations: []
  - name: Педантичность
    stress: []
    definition: >-
      Склонность к предельной точности, аккуратности и строгому соблюдению установленного порядка.
      Она помогает там, где важны детали, но становится утомительной, когда форма начинает заслонять
      смысл.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пертурбация
    stress: []
    definition: >-
      Резкое нарушение привычного порядка, вызывающее заметное изменение или замешательство. В
      астрономии пертурбацией называют отклонение движения небесного тела под влиянием притяжения
      других тел.
    synonyms: []
    antonyms: []
    relations: []
  - name: Перфекционизм
    stress: []
    definition: >-
      Стремление доводить результат до безупречности и неприятие заметных недостатков. Он может
      поддерживать высокое качество, но мешает делу, когда страх несовершенства не позволяет
      закончить работу или вообще начать её.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пиетет
    stress: []
    definition: >-
      Глубокое почтение и почти благоговейное уважение к человеку, идее или традиции. Пиетет
      предполагает дистанцию: объектом можно восхищаться, но спорить с ним становится труднее.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пипидастр
    stress: []
    definition: >-
      Пушистая метёлка для удаления пыли с поверхностей. Забавное звучание слова часто привлекает
      больше внимания, чем сам незамысловатый предмет.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пируэт
    stress: []
    definition: >-
      Полный поворот тела вокруг своей оси, особенно в балете и фигурном катании. В переносной речи
      пируэтом называют ловкий, неожиданный поворот мысли или поведения.
    synonyms: []
    antonyms: []
    relations: []
  - name: Плебей
    stress: []
    definition: >-
      Представитель плебса — свободного, но первоначально политически неполноправного населения
      Древнего Рима. Переносное употребление в значении «грубый, невоспитанный человек» носит
      пренебрежительный характер.
    synonyms: []
    antonyms: []
    relations: []
  - name: Популизм
    stress: []
    definition: >-
      Политический подход, который противопоставляет «простой народ» элитам и обещает выражать его
      непосредственную волю. Популистская риторика часто предлагает понятные ответы на сложные
      вопросы, но сам термин бывает и описанием стратегии, и полемическим ярлыком.
    synonyms: []
    antonyms: []
    relations: []
  - name: Портупея
    stress: []
    definition: >-
      Система ремней, на которой военнослужащий носит оружие или элементы снаряжения. Её надевают
      поверх формы, распределяя вес между поясом и плечом.
    synonyms: []
    antonyms: []
    relations: []
  - name: Предтечи
    stress: []
    definition: >-
      Те, кто появились раньше и подготовили почву для последующего явления, движения или человека.
      Предтеча не обязательно похож на наследника во всём, но без его шага продолжение было бы
      труднее представить.
    synonyms: []
    antonyms: []
    relations: []
  - name: Прекариат
    stress: []
    definition: >-
      Люди с нестабильной занятостью, непредсказуемым доходом и слабой социальной защищённостью. Это
      не просто временно безработные, а группа, для которой неопределённость стала постоянным
      условием труда и жизни.
    synonyms: []
    antonyms: []
    relations: []
  - name: Препона
    stress: []
    definition: >-
      Препятствие, преграда или помеха; слово устаревшее и чаще встречается во множественном числе.
      «Без препон» означает свободно, без искусственно созданных затруднений.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пресловутый
    stress: []
    definition: >-
      Широко известный по разговорам и постоянным упоминаниям, обычно с оттенком раздражения или
      неодобрения. Пресловутая вещь знаменита не обязательно заслугами — скорее тем, что о ней уже
      устали слышать.
    synonyms: []
    antonyms: []
    relations: []
  - name: Прецедент
    stress: []
    definition: >-
      Случай из прошлого, который служит примером или основанием для решения похожих ситуаций в
      будущем. Прецедент задаёт образец, тогда как инцидент всего лишь обозначает отдельное
      происшествие.
    synonyms: []
    antonyms: []
    relations: []
  - name: Променад
    stress: []
    definition: >-
      Неспешная прогулка, обычно ради отдыха, общения и возможности показаться на людях. Слово
      сохраняет лёгкий оттенок старомодной светскости.
    synonyms: []
    antonyms: []
    relations: []
  - name: Прострация
    stress: []
    definition: >-
      Состояние крайней физической и психической подавленности, когда человеку трудно двигаться,
      реагировать и действовать. В разговоре так могут назвать сильнейшее изнеможение, но
      продолжительное состояние требует не красивого слова, а внимания к здоровью.
    synonyms: []
    antonyms: []
    relations: []
  - name: Протагонист
    stress: []
    definition: >-
      Главное действующее лицо произведения или основной участник конфликта, за чьей целью следует
      повествование. Протагонист не обязан быть положительным героем — достаточно того, что история
      выстроена вокруг его действий.
    synonyms: []
    antonyms: []
    relations: []
  - name: Протеже
    stress: []
    definition: >-
      Человек, которому оказывает покровительство более влиятельное или опытное лицо. Поддержка
      помогает протеже получить возможность или положение, до которых без такого участия было бы
      добраться труднее.
    synonyms: []
    antonyms: []
    relations: []
  - name: Пюпитр
    stress: []
    definition: >-
      Наклонная подставка для нот, книг или текста выступления. Она удерживает листы на удобной для
      чтения высоте и освобождает руки исполнителя.
    synonyms: []
    antonyms: []
    relations: []
