letter: М
words:
  - name: Манифестация
    stress: []
    definition: >-
      Явное, доступное наблюдению проявление идеи, свойства или состояния. В
      общественно-политическом контексте манифестацией также называют массовое публичное выступление
      или демонстрацию.
    synonyms: []
    antonyms: []
    relations: []
  - name: Манчкин
    stress: []
    definition: >-
      В ролевых и настольных играх — участник, который стремится получить максимальное игровое
      преимущество, иногда в ущерб сюжету, атмосфере и интересам команды. В других контекстах
      манчкинами называют жителей страны Оз и породу коротколапых кошек.
    synonyms: []
    antonyms: []
    relations: []
  - name: Ментальность
    stress: []
    definition: >-
      Устойчивый способ воспринимать мир, оценивать происходящее и действовать, характерный для
      человека или сообщества. Ментальность складывается из опыта, культуры и привычек, а не
      передаётся как неизменный набор национальных черт.
    synonyms: []
    antonyms: []
    relations: []
  - name: Мизогиния
    stress: []
    definition: >-
      Неприязнь, презрение или предубеждение по отношению к женщинам. Она проявляется не только в
      открытой ненависти, но и в устойчивых представлениях о женской неполноценности или
      допустимости неравного обращения.
    synonyms: []
    antonyms: []
    relations: []
  - name: Моветон
    stress: []
    definition: >-
      Дурной тон — поведение, манера или поступок, считающиеся неприличными в определённой среде.
      Поскольку правила приличия меняются, вчерашний моветон иногда становится завтрашней нормой, и
      наоборот.
    synonyms: []
    antonyms: []
    relations: []
  - name: Моджо
    stress: []
    definition: >-
      Разговорное название особой привлекательности, уверенности и внутреннего заряда, благодаря
      которым у человека всё будто начинает получаться. Изначально в афроамериканской традиции моджо
      называли магический талисман или приписываемую ему силу.
    synonyms: []
    antonyms: []
    relations: []
  - name: Мондегрин
    stress: []
    definition: >-
      Ослышанная строка песни или стихотворения, которая превращается в другую, но по-своему
      правдоподобную фразу. Мозг достраивает неразборчивые звуки знакомыми словами — иногда
      настолько удачно, что ошибочный вариант запоминается лучше оригинала.
    synonyms: []
    antonyms: []
    relations: []
  - name: Мораторий
    stress: []
    definition: >-
      Официальная временная приостановка действия, обязанности или запрета на определённую
      деятельность. Мораторий не отменяет решение навсегда, а откладывает его исполнение до срока
      или изменения условий.
    synonyms: []
    antonyms: []
    relations: []
  - name: Мытарство
    stress: []
    definition: >-
      Тяжёлое испытание, мучительное хождение по инстанциям или долгая череда неприятных хлопот. В
      православной традиции мытарствами также называют посмертные испытания души, но в быту слово
      давно живёт шире религиозного смысла.
    synonyms: []
    antonyms: []
    relations: []
