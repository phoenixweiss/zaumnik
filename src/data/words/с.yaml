letter: С
words:
  - name: Сакральный
    stress: []
    definition: >-
      Священный, относящийся к религиозному культу и отделённый от повседневного мира. В широкой
      речи сакральным называют то, чему придают высшую, неприкосновенную ценность.
    synonyms: []
    antonyms: []
    relations: []
  - name: Саммит
    stress: []
    definition: >-
      Встреча руководителей государств или организаций на высшем уровне. Саммит отличается от
      обычной конференции прежде всего статусом участников и масштабом решений, которых от него
      ожидают.
    synonyms: []
    antonyms: []
    relations: []
  - name: Семантика
    stress: []
    definition: >-
      Значение слов, выражений и других знаков, а также раздел науки, который эти значения изучает.
      Когда меняется семантика слова, форма может остаться прежней, а смысл — заметно сдвинуться.
    synonyms: []
    antonyms: []
    relations: []
  - name: Сентенция
    stress: []
    definition: >-
      Краткое поучительное изречение, сформулированное как общая мудрость или нравственный вывод.
      Сентенция звучит веско, хотя её убедительность зависит не от торжественного тона, а от
      содержания.
    synonyms: []
    antonyms: []
    relations: []
  - name: Синергия
    stress: []
    definition: >-
      Эффект совместного действия, при котором взаимодействие частей даёт результат, недостижимый
      простым сложением их отдельных усилий. Само сотрудничество ещё не гарантирует синергии —
      дополнительный эффект должен действительно возникнуть.
    synonyms: []
    antonyms: []
    relations: []
  - name: Синопсис
    stress: []
    definition: >-
      Краткое и связное изложение содержания произведения, проекта или исследования. Хороший
      синопсис показывает основную линию и структуру, не превращаясь ни в рекламный слоган, ни в
      подробный пересказ.
    synonyms: []
    antonyms: []
    relations: []
  - name: Сноб
    stress: []
    definition: >-
      Человек, подчёркивающий собственную принадлежность к более престижному кругу и оценивающий
      других по статусу, вкусам или культурным знакам. Снобизм начинается там, где интерес к
      качеству превращается в способ почувствовать превосходство.
    synonyms: []
    antonyms: []
    relations: []
  - name: Стигматизация
    stress: []
    definition: >-
      Навешивание на человека или группу устойчивого отрицательного ярлыка, который затмевает их
      реальные особенности. Стигма облегчает исключение и дискриминацию, потому что вместо
      конкретного человека окружающие начинают видеть один нежелательный признак.
    synonyms: []
    antonyms: []
    relations: []
  - name: Стяжатель
    stress: []
    definition: >-
      Человек, одержимый накоплением имущества и личной выгодой. Слово книжное и явно
      неодобрительное: бережливость становится стяжательством, когда приобретение превращается в
      главную цель.
    synonyms: []
    antonyms: []
    relations: []
  - name: Субтильный
    stress: []
    definition: >-
      Хрупкий, тонкий и изящный по телосложению или строению. В старой книжной речи слово могло
      также означать тонкий, деликатный и едва уловимый.
    synonyms: []
    antonyms: []
    relations: []
  - name: Супостат
    stress: []
    definition: >-
      Враг или недруг; слово старинное, сегодня чаще ироническое. Назвать кого-то супостатом —
      значит придать обычной неприязни нарочито былинный размах.
    synonyms: []
    antonyms: []
    relations: []
  - name: Сутяжничество
    stress: []
    definition: >-
      Склонность постоянно затевать тяжбы, жалобы и судебные споры, особенно по мелким или
      надуманным поводам. Для сутяжника сам процесс борьбы нередко становится важнее разумного
      результата.
    synonyms: []
    antonyms: []
    relations: []
