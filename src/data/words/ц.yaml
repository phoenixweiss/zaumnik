letter: Ц
words:
  - name: Цимес
    stress:
      - 2
    definition: >-
      Блюдо еврейской кухни — обычно сладкое рагу из моркови с фруктами или сухофруктами. В
      разговорном выражении «самый цимес» слово означает главную прелесть, самую ценную или приятную
      часть чего-либо.
    synonyms:
      - самая суть
      - самое лучшее
    antonyms: []
    relations: []
  - name: Цугцванг
    stress:
      - 6
    definition: >-
      Положение в шахматах или другой игре, где любой обязательный ход ухудшает ситуацию игрока. В
      переносной речи так называют выбор без хорошего варианта, хотя в игре важно именно то, что
      отказаться от хода нельзя.
    synonyms: []
    antonyms: []
    relations: []
