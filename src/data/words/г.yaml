letter: Г
words:
  - name: Гауляйтер
    stress:
      - 5
    definition: >-
      Руководитель областной партийной организации в нацистской Германии, наделённый значительной
      политической властью. В переносной речи слово используют как резко осуждающее сравнение с
      самовластным наместником, но его исторический смысл остаётся вполне конкретным.
    synonyms: []
    antonyms: []
    relations: []
  - name: Гештальт
    stress:
      - 5
    definition: >-
      Целостная форма, которую восприятие собирает из отдельных элементов и которая не сводится к их
      простой сумме. Популярное выражение «закрыть гештальт» означает завершить переживаемую как
      незавершённую ситуацию, хотя это более вольное употребление психологического термина.
    synonyms:
      - целостный образ
    antonyms: []
    relations: []
  - name: Гиммик
    stress:
      - 2
    definition: >-
      Необычный приём, образ или деталь, придуманные прежде всего для привлечения внимания и
      запоминаемости. Хороший гиммик поддерживает содержание, плохой быстро обнаруживает, что кроме
      эффектной оболочки показывать нечего.
    synonyms:
      - приём
      - трюк
    antonyms: []
    relations: []
  - name: Гомогенный
    stress:
      - 6
    definition: >-
      Однородный по составу, свойствам или происхождению. В гомогенной смеси или группе различия
      между отдельными частями несущественны для рассматриваемого признака.
    synonyms:
      - однородный
    antonyms:
      - гетерогенный
    relations: []
