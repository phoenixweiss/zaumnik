letter: В
words:
  - name: Вендинг
    stress:
      - 2
    definition: >-
      Продажа товаров и услуг через автоматы без участия продавца. К вендингу относятся не только
      аппараты с кофе и снеками, но и любые автоматизированные точки выдачи и оплаты.
    synonyms: []
    antonyms: []
    relations: []
  - name: Вербальный
    stress:
      - 5
    definition: >-
      Связанный со словами и речью — устной либо письменной. Вербальному общению противопоставляют
      невербальные сигналы вроде жестов, мимики и интонации.
    synonyms: []
    antonyms: []
    relations: []
  - name: Визави
    stress:
      - 6
    definition: >-
      Человек, находящийся напротив или выступающий собеседником и партнёром в конкретной ситуации.
      Слово не обязательно означает соперника: визави может быть любой участник разговора по другую
      сторону стола.
    synonyms: []
    antonyms: []
    relations: []
  - name: Волюнтаризм
    stress:
      - 9
    definition: >-
      Подход, при котором решения принимают одной лишь волей, не считаясь с обстоятельствами,
      знаниями и возможными последствиями. В философии этим словом также называют учения, признающие
      волю главным началом мира или человеческой деятельности.
    synonyms: []
    antonyms: []
    relations: []
