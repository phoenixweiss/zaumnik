letter: Ф
words:
  - name: Фарс
    stress:
      - 2
    definition: >-
      Комедия с нарочито грубыми, преувеличенными ситуациями, стремительным действием и
      маловероятными совпадениями. В переносном смысле фарсом называют серьёзное с виду дело,
      превратившееся в нелепую имитацию.
    synonyms:
      - балаган
      - буффонада
    antonyms: []
    relations: []
  - name: Фарт
    stress:
      - 2
    definition: >-
      Удача, счастливое стечение обстоятельств; слово разговорное и жаргонное. Фарт помогает
      выиграть эпизод, но рассчитывать на него как на стратегию довольно смело.
    synonyms:
      - везение
      - удача
    antonyms: []
    relations: []
  - name: Фетиш
    stress:
      - 4
    definition: >-
      Предмет, которому приписывают сверхъестественную силу и который становится объектом
      поклонения. В переносной речи фетишем называют вещь или идею, возведённую в абсолют; в
      сексологии термин имеет отдельное специальное значение.
    synonyms:
      - идол
      - кумир
    antonyms: []
    relations: []
  - name: Филигранный
    stress:
      - 7
    definition: >-
      Выполненный исключительно тонко, точно и мастерски. Слово происходит от филиграни — ювелирной
      техники создания узора из тонкой металлической проволоки.
    synonyms:
      - отточенный
      - тонкий
      - точный
    antonyms: []
    relations: []
  - name: Флёр
    stress:
      - 3
    definition: >-
      Лёгкий покров, оттенок или атмосфера, окружающие предмет и меняющие его восприятие. Флёр
      таинственности ничего не скрывает полностью, но делает привычное менее прямолинейным.
    synonyms: []
    antonyms: []
    relations: []
  - name: Флуктуация
    stress:
      - 7
    definition: >-
      Небольшое колебание или случайное отклонение величины от среднего либо устойчивого состояния.
      Флуктуации возникают в физических системах, статистике, экономике и везде, где процесс не
      бывает идеально ровным.
    synonyms:
      - колебание
      - отклонение
    antonyms: []
    relations: []
  - name: Форензика
    stress:
      - 4
    definition: >-
      Совокупность методов поиска, сохранения и анализа данных, которые могут стать доказательствами
      расследования. Чаще всего говорят о компьютерной форензике, но сходный подход применяют также
      к финансовым документам и другим следам событий.
    synonyms: []
    antonyms: []
    relations: []
  - name: Фрик
    stress:
      - 3
    definition: >-
      Человек, резко выделяющийся внешностью, поведением или образом жизни из привычной среды. Слово
      может быть самоназванием и знаком независимости, но со стороны нередко звучит как насмешливый
      или уничижительный ярлык.
    synonyms:
      - чудак
    antonyms: []
    relations: []
  - name: Фрустрация
    stress:
      - 7
    definition: >-
      Напряжение, разочарование и раздражение, возникающие, когда важная цель оказывается
      недоступной или путь к ней перекрыт. Фрустрация — это реакция на препятствие, а не название
      любого плохого настроения.
    synonyms:
      - неудовлетворённость
      - подавленность
      - разочарование
    antonyms: []
    relations: []
