letter: О
words:
  - name: Огульный
    stress: []
    definition: >-
      Неразборчивый и распространяемый на всех сразу, без внимания к различиям и фактам. Огульное
      обвинение удобно своей широтой, но именно поэтому обычно мало что доказывает.
    synonyms: []
    antonyms: []
    relations: []
  - name: Одиозный
    stress: []
    definition: >-
      Вызывающий резко отрицательное отношение и дурную известность. Одиозным называют не просто
      заметного или спорного человека, а того, чья репутация воспринимается как отталкивающая.
    synonyms: []
    antonyms: []
    relations: []
  - name: Оказия
    stress: []
    definition: >-
      Удобный случай или редкая возможность сделать что-либо попутно. В старой речи слово могло
      обозначать и неожиданное происшествие, поэтому точный оттенок зависит от контекста.
    synonyms: []
    antonyms: []
    relations: []
  - name: Оккультный
    stress: []
    definition: >-
      Связанный с учениями и практиками о тайных сверхъестественных силах, доступных якобы только
      посвящённым. Оккультное знание относится к области верований и не равнозначно научному
      объяснению явлений.
    synonyms: []
    antonyms: []
    relations: []
  - name: Окольный
    stress: []
    definition: >-
      Непрямой, обходной и ведущий к цели не самым коротким путём. Окольной бывает дорога, но чаще
      слово встречается в выражениях об уклончивых объяснениях и действиях через посредников.
    synonyms: []
    antonyms: []
    relations: []
  - name: Оммаж
    stress: []
    definition: >-
      Осознанная дань уважения другому автору, произведению или традиции. Оммаж повторяет узнаваемый
      мотив не для маскировки заимствования, а чтобы вступить с источником в открытый диалог.
    synonyms: []
    antonyms: []
    relations: []
