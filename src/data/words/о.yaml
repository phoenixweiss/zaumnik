letter: О
words:
  - name: Обскурантизм
    stress:
      - 10
    definition: >-
      Враждебное отношение к просвещению, науке и распространению знаний. Обскурантизм не просто
      сомневается в новой идее, а стремится удержать знание в темноте, особенно если оно угрожает
      привычному порядку.
    synonyms:
      - мракобесие
    antonyms:
      - просветительство
      - свободомыслие
    relations:
      - word: Догма
        type: related
  - name: Огульный
    stress:
      - 3
    definition: >-
      Неразборчивый и распространяемый на всех сразу, без внимания к различиям и фактам. Огульное
      обвинение удобно своей широтой, но именно поэтому обычно мало что доказывает.
    synonyms:
      - бездоказательный
      - голословный
      - необоснованный
    antonyms: []
    relations: []
  - name: Одиозный
    stress:
      - 4
    definition: >-
      Вызывающий резко отрицательное отношение и дурную известность. Одиозным называют не просто
      заметного или спорного человека, а того, чья репутация воспринимается как отталкивающая.
    synonyms:
      - ненавистный
      - отталкивающий
    antonyms: []
    relations: []
  - name: Оказия
    stress:
      - 3
    definition: >-
      Удобный случай или редкая возможность сделать что-либо попутно. В старой речи слово могло
      обозначать и неожиданное происшествие, поэтому точный оттенок зависит от контекста.
    synonyms:
      - возможность
      - случай
    antonyms: []
    relations: []
  - name: Оккультный
    stress:
      - 4
    definition: >-
      Связанный с учениями и практиками о тайных сверхъестественных силах, доступных якобы только
      посвящённым. Оккультное знание относится к области верований и не равнозначно научному
      объяснению явлений.
    synonyms:
      - мистический
      - тайный
    antonyms: []
    relations: []
  - name: Окольный
    stress:
      - 3
    definition: >-
      Непрямой, обходной и ведущий к цели не самым коротким путём. Окольной бывает дорога, но чаще
      слово встречается в выражениях об уклончивых объяснениях и действиях через посредников.
    synonyms:
      - косвенный
      - обходной
    antonyms:
      - прямой
    relations: []
  - name: Оммаж
    stress:
      - 4
    definition: >-
      Осознанная дань уважения другому автору, произведению или традиции. Оммаж повторяет узнаваемый
      мотив не для маскировки заимствования, а чтобы вступить с источником в открытый диалог.
    synonyms:
      - дань уважения
    antonyms: []
    relations: []
  - name: Опрессия
    stress:
      - 4
    definition: >-
      Устаревшее название чувства стеснения, давления или тяжести, прежде всего в груди. Сегодня
      слово почти исчезло из русского языка: его заменили более точные «сдавленность», «стеснение» и
      «давление».
    synonyms:
      - сдавленность
      - стеснение
    antonyms: []
    relations: []
  - name: Отроверт
    stress:
      - 6
    definition: >-
      Новое популярно-психологическое название человека, который способен общаться и строить близкие
      отношения, но не связывает свою идентичность с принадлежностью к группам и сохраняет
      эмоциональную независимость от них. Термин предложил психиатр Рами Камински; признанным
      научным типом личности он пока не считается и не заменяет понятия интроверсии и экстраверсии.
    synonyms: []
    antonyms: []
    relations:
      - word: Интроверт
        type: related
      - word: Экстраверт
        type: related
