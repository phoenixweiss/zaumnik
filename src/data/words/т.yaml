letter: Т
words:
  - name: Тавтология
    stress:
      - 7
    definition: >-
      Повторение одного и того же смысла теми же или близкими словами без новой информации. В логике
      тавтологией также называют формулу, истинную при любых значениях её частей, поэтому значение
      термина зависит от области.
    synonyms:
      - повторение
      - тождесловие
    antonyms: []
    relations:
      - word: Трюизм
        type: confused
  - name: Теодицея
    stress:
      - 7
    definition: >-
      Попытка согласовать существование зла и страдания с верой во всемогущего и благого Бога.
      Теодицея не отрицает проблему, а предлагает философское или богословское объяснение того,
      почему такой мир всё же возможен.
    synonyms: []
    antonyms: []
    relations: []
  - name: Толика
    stress:
      - 4
    definition: >-
      Небольшая доля или малое количество чего-либо. Слово книжное: «толика терпения» звучит чуть
      торжественнее, чем обычное «немного».
    synonyms:
      - крупица
      - частица
    antonyms: []
    relations: []
  - name: Толмач
    stress:
      - 5
    definition: >-
      Переводчик, особенно передающий устную речь между людьми, говорящими на разных языках. Слово
      старинное и сегодня обычно появляется в историческом или стилизованном контексте.
    synonyms:
      - переводчик
    antonyms: []
    relations: []
  - name: Трансцендентный
    stress:
      - 10
    definition: >-
      Находящийся за пределами возможного опыта или обычного познания. В философии это строгий
      термин, поэтому использовать его просто как нарядную замену слову «непонятный» — значит
      заметно обеднять смысл.
    synonyms:
      - запредельный
      - непостижимый
    antonyms: []
    relations: []
  - name: Тривиальный
    stress:
      - 6
    definition: >-
      Обыденный, избитый и не содержащий ничего нового или сложного. В математике тривиальным
      называют самое простое, непосредственно очевидное решение, и это не обязательно упрёк.
    synonyms:
      - банальный
      - заурядный
      - обыденный
    antonyms:
      - оригинальный
    relations: []
  - name: Троглодит
    stress:
      - 8
    definition: >-
      В буквальном смысле — обитатель пещеры; так называли древние или описанные в легендах народы.
      В переносной речи это грубое обозначение крайне невежественного и некультурного человека.
    synonyms:
      - дикарь
      - невежда
    antonyms: []
    relations: []
  - name: Трюизм
    stress:
      - 4
    definition: >-
      Очевидная и избитая мысль, которую трудно оспорить именно потому, что в ней почти нет нового
      содержания. Трюизм может быть верным, но редко двигает разговор вперёд: фраза «всё зависит от
      обстоятельств» звучит разумно и мало что решает.
    synonyms:
      - азбучная истина
      - банальность
      - прописная истина
    antonyms: []
    relations:
      - word: Сентенция
        type: related
      - word: Тавтология
        type: confused
  - name: Тульпа
    stress:
      - 2
    definition: >-
      Образ существа, которое человек намеренно и подробно создаёт в воображении, иногда описывая
      его как самостоятельного собеседника. Современное интернет-понятие лишь вольно опирается на
      тибетские религиозные представления и не доказывает отдельного существования такого образа.
    synonyms: []
    antonyms: []
    relations: []
