letter: Х
words:
  - name: Хтонь
    stress: []
    definition: >-
      Всё мрачное, первобытное и связанное с подземным миром или древними силами земли. В
      современной разговорной речи хтонью называют вязкую смесь ужаса, запустения и абсурда, которая
      будто существовала здесь задолго до всякого порядка.
