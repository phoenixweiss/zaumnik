letter: И
words:
  - name: Имплементация
    stress:
      - 10
    definition: >-
      Практическое воплощение решения, правила или замысла. В праве это включение норм в действующую
      систему, а в разработке — конкретная реализация задуманной функции.
    synonyms: []
    antonyms: []
    relations: []
  - name: Импликация
    stress:
      - 7
    definition: >-
      Связь вида «если одно верно, то из него следует другое». В логике импликация имеет строгое
      значение, а в обычной речи словом могут называть подразумеваемое следствие или скрытую связь.
    synonyms: []
    antonyms: []
    relations: []
  - name: Импонировать
    stress:
      - 6
    definition: >-
      Вызывать симпатию, одобрение или уважение. Правильно сказать «мне импонирует его спокойствие»:
      впечатляет именно качество или человек, а не говорящий производит впечатление на него.
    synonyms: []
    antonyms: []
    relations: []
  - name: Импорт
    stress:
      - 1
    definition: >-
      Ввоз товаров, услуг или технологий из другой страны. В программировании импортом называют
      подключение данных или кода из другого файла либо модуля.
    synonyms: []
    antonyms: []
    relations: []
  - name: Импрессум
    stress:
      - 5
    definition: >-
      Обязательные сведения об издателе, редакции и ответственных за публикацию лицах. Такой блок
      особенно распространён в немецкоязычных странах и размещается в печатном издании или на сайте.
    synonyms: []
    antonyms: []
    relations: []
  - name: Имярек
    stress:
      - 5
    definition: >-
      Условное обозначение имени, которое нужно подставить в текст позднее или которое намеренно не
      называют. Старое книжное слово работает примерно как современное «такой-то».
    synonyms: []
    antonyms: []
    relations: []
  - name: Индульгенция
    stress:
      - 8
    definition: >-
      В католической традиции — освобождение от временного наказания за грехи, вина за которые уже
      прощена. В переносной речи индульгенцией называют заранее выданное оправдание или разрешение
      не отвечать за последствия.
    synonyms: []
    antonyms: []
    relations: []
  - name: Инклюзивность
    stress:
      - 7
    definition: >-
      Устройство среды, при котором люди с разными особенностями и возможностями могут полноценно
      участвовать в общей жизни. Это не простое присутствие, а доступ к тем же действиям, решениям и
      уважительному отношению.
    synonyms: []
    antonyms: []
    relations: []
  - name: Инконсистентность
    stress:
      - 10
    definition: >-
      Внутренняя несогласованность данных, правил или утверждений. Если части системы противоречат
      друг другу либо одинаковые случаи обрабатываются по-разному, систему называют инконсистентной.
    synonyms: []
    antonyms: []
    relations: []
  - name: Инсайт
    stress:
      - 4
    definition: >-
      Внезапное понимание сути задачи, ситуации или собственного переживания. Инсайт ощущается как
      «теперь всё ясно», но полезность озарения всё равно проверяется тем, что оно объясняет и к
      чему приводит.
    synonyms: []
    antonyms: []
    relations: []
  - name: Инсинуация
    stress:
      - 7
    definition: >-
      Злонамеренный намёк или утверждение, которое должно незаметно внушить подозрение и опорочить
      кого-либо. Инсинуация действует не прямым обвинением, а расчётом на то, что слушатель сам
      достроит неприятный вывод.
    synonyms: []
    antonyms: []
    relations: []
  - name: Интенсивный
    stress:
      - 7
    definition: >-
      Дающий больше результата за счёт усиления, качества или эффективности процесса. Интенсивный
      рост использует имеющиеся ресурсы продуктивнее, тогда как экстенсивный достигается главным
      образом их увеличением.
    synonyms: []
    antonyms: []
    relations: []
  - name: Интерполяция
    stress:
      - 9
    definition: >-
      Оценка промежуточного значения по уже известным точкам внутри наблюдаемого диапазона. Она
      помогает заполнить пробел между данными, но точность зависит от того, насколько верно выбрана
      закономерность.
    synonyms: []
    antonyms: []
    relations: []
  - name: Интроверт
    stress:
      - 7
    definition: >-
      Человек, чьё внимание и восстановление сил в большей степени связаны с внутренним миром и
      ограниченным кругом контактов. Интроверсия не равна застенчивости, нелюдимости или
      неспособности общаться.
    synonyms: []
    antonyms: []
    relations: []
  - name: Интроспекция
    stress:
      - 8
    definition: >-
      Наблюдение человека за собственными мыслями, чувствами и внутренними состояниями. Такой
      самоанализ даёт личный материал для понимания себя, хотя не гарантирует полной объективности.
    synonyms: []
    antonyms: []
    relations: []
  - name: Инфантилизм
    stress:
      - 9
    definition: >-
      Сохранение у взрослого черт поведения и способов реагирования, характерных для более раннего
      возраста. Обычно речь идёт о несамостоятельности, избегании ответственности и ожидании, что
      важные решения примет кто-то другой.
    synonyms: []
    antonyms: []
    relations: []
  - name: Инцест
    stress:
      - 4
    definition: >-
      Сексуальные отношения между близкими родственниками, для которых такая связь запрещена законом
      или культурной нормой. Термин относится к родству и не имеет отношения к созвучному слову
      «эксцесс».
    synonyms: []
    antonyms: []
    relations: []
  - name: Инцидент
    stress:
      - 6
    definition: >-
      Отдельное происшествие, обычно неприятное и нарушающее нормальный ход событий. Инцидент — это
      случившийся эпизод, а прецедент — прошлый случай, который становится образцом для последующих
      решений.
    synonyms: []
    antonyms: []
    relations: []
  - name: Ипостась
    stress:
      - 6
    definition: >-
      Отдельная форма проявления или роль одного и того же человека либо явления. В христианском
      богословии слово имеет более строгое значение и обозначает каждое из трёх Лиц Троицы.
    synonyms: []
    antonyms: []
    relations: []
