letter: Д
words:
  - name: Девиант
    stress:
      - 5
    definition: >-
      Человек, чьё поведение заметно отклоняется от принятых в определённой среде социальных норм.
      Термин описывает отношение к норме, а не автоматически преступность, болезнь или моральную
      испорченность.
    synonyms: []
    antonyms: []
    relations: []
  - name: Дежавю
    stress:
      - 6
    definition: >-
      Краткое ощущение, будто нынешняя ситуация уже происходила раньше, хотя человек понимает, что
      это не так. Это распространённый эффект памяти, а не воспоминание о реальном повторении
      события.
    synonyms: []
    antonyms: []
    relations: []
  - name: Демаркация
    stress:
      - 7
    definition: >-
      Установление и обозначение границы между территориями, областями или понятиями. После
      договорённости о линии её могут буквально отметить на местности — столбами, знаками и другими
      ориентирами.
    synonyms:
      - разграничение
      - размежевание
    antonyms: []
    relations: []
  - name: Депривация
    stress:
      - 7
    definition: >-
      Состояние нехватки чего-то существенно важного — общения, сна, движения, безопасности или
      эмоционального контакта. Важна не всякая неудовлетворённость, а длительное лишение
      потребности, влияющее на состояние и развитие человека.
    synonyms:
      - лишение
      - недостаток
    antonyms: []
    relations: []
  - name: Дивергент
    stress:
      - 7
    definition: >-
      В научной терминологии — объект, вариант или признак, развивающийся по расходящейся линии. В
      лингвистике дивергентом называют одну из фонем, произошедших из общего источника; популярная
      культура перенесла слово на человека, не укладывающегося в одну жёсткую категорию.
    synonyms: []
    antonyms:
      - конвергент
    relations:
      - word: Конвергент
        type: opposite
  - name: Дилетант
    stress:
      - 6
    definition: >-
      Человек, занимающийся наукой, искусством или другим делом без специальной подготовки. Слово
      может обозначать просто увлечённого любителя, но чаще звучит неодобрительно — особенно когда
      поверхностные знания выдаются за компетентность.
    synonyms:
      - любитель
      - неспециалист
    antonyms:
      - профессионал
    relations: []
  - name: Дискредитация
    stress:
      - 10
    definition: >-
      Подрыв доверия, авторитета или репутации человека, организации либо идеи. Для этого могут
      использовать реальные проступки, искажённые сведения или намеренно созданное впечатление
      ненадёжности.
    synonyms:
      - компрометация
      - очернение
    antonyms: []
    relations: []
  - name: Дискурс
    stress:
      - 2
    definition: >-
      Способ говорить и мыслить о некоторой теме, сложившийся в определённой среде и эпохе. Дискурс
      включает не только слова, но и привычные рамки, допущения и правила того, что считается
      уместным или убедительным.
    synonyms:
      - рассуждение
      - речь
    antonyms: []
    relations:
      - word: Нарратив
        type: confused
  - name: Диссидент
    stress:
      - 7
    definition: >-
      Человек, открыто не согласный с господствующей идеологией или политикой и выступающий против
      официальной власти. В советском контексте диссидентами называли участников преимущественно
      ненасильственного правозащитного и культурного сопротивления.
    synonyms:
      - инакомыслящий
    antonyms: []
    relations:
      - word: Фронда
        type: related
  - name: Диссонанс
    stress:
      - 7
    definition: >-
      Несогласованность или столкновение элементов, которые ожидались гармоничными. В музыке это
      напряжённое сочетание звуков, а в переносной речи — заметное противоречие между впечатлениями,
      идеями или обстоятельствами.
    synonyms:
      - дисгармония
      - несогласованность
      - разлад
    antonyms:
      - гармония
      - консонанс
    relations:
      - word: Когнитивный диссонанс
        type: related
  - name: Дифирамб
    stress:
      - 6
    definition: >-
      Восторженная, часто чрезмерная похвала. Изначально дифирамбом называли торжественную хоровую
      песнь в честь Диониса, но сегодня слово чаще встречается во фразе «петь дифирамбы».
    synonyms:
      - восхваление
      - панегирик
      - похвала
    antonyms: []
    relations: []
  - name: Догма
    stress:
      - 2
    definition: >-
      Положение, признаваемое обязательным и не подлежащим сомнению внутри учения или системы
      взглядов. За пределами религии слово часто звучит критически, когда правило продолжают
      защищать без проверки и обсуждения.
    synonyms: []
    antonyms: []
    relations:
      - word: Канон
        type: confused
      - word: Обскурантизм
        type: related
  - name: Драндулет
    stress:
      - 8
    definition: >-
      Старая, расхлябанная или видавшая виды повозка либо машина. Слово почти всегда звучит
      насмешливо: драндулетом называют транспорт, который ещё едет, но уже не внушает доверия.
    synonyms:
      - развалюха
      - таратайка
    antonyms: []
    relations: []
