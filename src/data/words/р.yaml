letter: Р
words:
  - name: Рандеву
    stress:
      - 7
    definition: >-
      Заранее условленная встреча, нередко романтическая. В специальной речи рандеву может
      обозначать согласованную встречу кораблей, аппаратов или подразделений — без всякого намёка на
      свидание.
    synonyms:
      - встреча
      - свидание
    antonyms: []
    relations: []
  - name: Реверанс
    stress:
      - 6
    definition: >-
      Почтительный поклон с приседанием, традиционный для придворного этикета и некоторых танцев. В
      переносном смысле реверансом называют демонстративный жест уважения или уступку чужим
      ожиданиям.
    synonyms:
      - книксен
      - поклон
    antonyms: []
    relations: []
  - name: Регалия
    stress:
      - 4
    definition: >-
      Знак высокого звания, власти или особого положения — например, корона, скипетр или орден. Во
      множественном числе регалии могут означать весь набор отличий и титулов человека.
    synonyms: []
    antonyms: []
    relations: []
  - name: Регламент
    stress:
      - 5
    definition: >-
      Установленный порядок работы, обсуждения или проведения процедуры. Регламент определяет не
      только что делать, но и в какой последовательности, в какие сроки и с какими ограничениями.
    synonyms:
      - порядок
      - правила
      - распорядок
    antonyms: []
    relations: []
  - name: Реминисценция
    stress:
      - 9
    definition: >-
      Неявный отголосок другого произведения, образа или события, узнаваемый в новом тексте. В
      отличие от прямой цитаты, реминисценция может возникать через сходный мотив, ритм или
      композицию.
    synonyms:
      - воспоминание
      - намёк
      - отголосок
    antonyms: []
    relations: []
  - name: Реноме
    stress:
      - 6
    definition: >-
      Сложившаяся репутация человека, организации или продукта. Реноме создаётся долго, а
      испортиться может от одного поступка, если он меняет привычное представление об объекте.
    synonyms:
      - престиж
      - репутация
    antonyms: []
    relations: []
  - name: Репликация
    stress:
      - 7
    definition: >-
      Создание копии или повторение процесса по тем же правилам. В науке репликация исследования
      проверяет воспроизводимость результата, а в биологии этим словом называют копирование молекулы
      ДНК.
    synonyms:
      - воспроизведение
      - копирование
      - повторение
    antonyms: []
    relations: []
  - name: Ресентимент
    stress:
      - 9
    definition: >-
      Длительная смесь обиды, бессилия и враждебности, которая превращается в систему моральных
      оценок. Человек не просто сердится, а переосмысливает недоступное или сильное как заведомо
      плохое, чтобы справиться с собственной невозможностью действовать.
    synonyms:
      - озлобление
    antonyms: []
    relations: []
  - name: Ретроспектива
    stress:
      - 11
    definition: >-
      Обзор событий или работ в обратном взгляде — от настоящего к прошлому. Ретроспективная
      выставка, например, показывает развитие автора за продолжительный период.
    synonyms:
      - обзор прошлого
      - ретроспекция
    antonyms: []
    relations: []
  - name: Рефлексия
    stress:
      - 5
    definition: >-
      Осмысление человеком собственных мыслей, чувств, решений и способов действия. Рефлексия не
      равна бесконечному самокопанию: её смысл в том, чтобы увидеть основания своего поведения и
      сделать выводы.
    synonyms:
      - размышление
      - самоанализ
      - самонаблюдение
    antonyms: []
    relations: []
  - name: Рецессия
    stress:
      - 4
    definition: >-
      Заметное и продолжающееся снижение экономической активности. Обычно оно проявляется падением
      производства, доходов, инвестиций и занятости, хотя точные критерии зависят от принятой
      методики.
    synonyms:
      - застой
      - спад
    antonyms: []
    relations: []
  - name: Ригидность
    stress:
      - 4
    definition: >-
      Недостаточная гибкость и трудность перестройки при изменении условий. Ригидным может быть
      мышление, поведение или структура, которая продолжает действовать по старой схеме, даже когда
      та перестала помогать.
    synonyms:
      - негибкость
      - неподатливость
    antonyms: []
    relations: []
  - name: Рокировка
    stress:
      - 6
    definition: >-
      Особый шахматный ход, при котором король и ладья за один ход меняют своё расположение по
      установленным правилам. В переносной речи рокировкой называют перестановку людей или сил ради
      более выгодной позиции.
    synonyms:
      - обмен
      - перестановка
    antonyms: []
    relations: []
  - name: Рубикон
    stress:
      - 6
    definition: >-
      Граница, после перехода которой решение становится практически необратимым. Выражение восходит
      к переходу Юлия Цезаря через реку Рубикон, после которого открытый конфликт с римским сенатом
      уже нельзя было отменить.
    synonyms:
      - граница
      - рубеж
    antonyms: []
    relations: []
