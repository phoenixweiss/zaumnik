letter: Б
words:
  - name: Бенефис
    stress:
      - 6
    definition: >-
      Представление в честь одного из его участников, устраиваемое как признание заслуг и мастерства
      артиста. Первоначально сбор от такого спектакля полностью или частично передавался
      бенефицианту; сегодня бенефисом также шутливо называют чьё-либо особенно заметное публичное
      выступление.
    synonyms:
      - чествование
    antonyms: []
    relations: []
  - name: Бифуркация
    stress:
      - 7
    definition: >-
      Разделение единого пути или состояния на две возможные ветви. В науке так называют точку, где
      небольшое изменение условий способно заметно изменить дальнейшее поведение системы.
    synonyms:
      - разветвление
      - раздвоение
    antonyms: []
    relations: []
  - name: Блажь
    stress:
      - 3
    definition: >-
      Внезапная прихоть или причуда, для которой трудно найти разумное основание. Обычно слово
      звучит неодобрительно и намекает, что желание пройдёт так же неожиданно, как появилось.
    synonyms:
      - каприз
      - прихоть
      - причуда
    antonyms: []
    relations: []
  - name: Бойкот
    stress:
      - 5
    definition: >-
      Сознательный отказ от общения, сотрудничества, покупки или участия как форма протеста и
      давления. Слово происходит от фамилии управляющего Чарльза Бойкотта, которого ирландские
      арендаторы в 1880 году подвергли именно такой общественной изоляции.
    synonyms:
      - общественная изоляция
      - отказ от сотрудничества
    antonyms:
      - поддержка
      - сотрудничество
    relations: []
  - name: Бутуз
    stress:
      - 4
    definition: >-
      Здоровый, крепкий и упитанный ребёнок, чаще мальчик. Слово разговорное и обычно звучит
      добродушно или ласково, хотя в неподходящем контексте замечание о внешности может оказаться
      бестактным.
    synonyms:
      - карапуз
      - крепыш
    antonyms: []
    relations:
      - word: Карапуз
        type: related
