letter: А
words:
  - name: Аберрация
    stress:
      - 6
    definition: >-
      Отклонение от ожидаемого или правильного состояния, из-за которого результат искажается. В
      оптике и астрономии так называют искажения изображения, а в обычной речи — заметное
      отступление от нормы.
    synonyms:
      - искажение
      - отклонение
    antonyms: []
    relations: []
  - name: Абстиненция
    stress:
      - 7
    definition: >-
      Состояние, возникающее после резкого прекращения или уменьшения употребления вещества, от
      которого сформировалась зависимость. Оно может проявляться и физически, и психологически — от
      тревоги и бессонницы до тяжёлых нарушений самочувствия.
    synonyms: []
    antonyms: []
    relations: []
  - name: Агломерация
    stress:
      - 8
    definition: >-
      Скопление и объединение близко расположенных объектов в связанную систему. Чаще всего речь
      идёт о городе и окружающих его населённых пунктах, между которыми сложились тесные трудовые,
      транспортные и экономические связи.
    synonyms:
      - объединение
      - скопление
    antonyms: []
    relations: []
  - name: Аддикция
    stress:
      - 4
    definition: >-
      Устойчивая зависимость от вещества или занятия, при которой тяга начинает управлять поведением
      и сохраняется вопреки вредным последствиям. Слово применяют не к любой привычке, а к той, над
      которой человек заметно теряет контроль.
    synonyms:
      - зависимость
    antonyms: []
    relations: []
  - name: Аксиома
    stress:
      - 5
    definition: >-
      Исходное положение, которое в рамках некоторой теории принимают без доказательства и
      используют для вывода других утверждений. В разговорной речи аксиомой называют мысль,
      кажущуюся настолько очевидной, что спорить с ней будто бы незачем.
    synonyms: []
    antonyms: []
    relations: []
  - name: Альденте
    stress:
      - 5
    definition: >-
      Степень готовности продукта, при которой он уже приготовлен, но сохраняет ощутимую упругость
      при укусе. Обычно так говорят о пасте, реже — об овощах и крупах.
    synonyms: []
    antonyms: []
    relations: []
  - name: Альтруизм
    stress:
      - 7
    definition: >-
      Готовность действовать ради блага других, не ожидая прямой выгоды для себя. Альтруистический
      поступок может требовать времени, сил или отказа от собственных преимуществ, но не обязательно
      полного самопожертвования.
    synonyms:
      - бескорыстие
      - самоотверженность
    antonyms:
      - эгоизм
    relations: []
  - name: Амальгама
    stress:
      - 7
    definition: >-
      Сплав ртути с другим металлом, способный быть жидким или твёрдым в зависимости от состава. В
      переносном смысле амальгамой называют смесь разнородных идей, свойств или влияний.
    synonyms:
      - смесь
      - сплав
    antonyms: []
    relations: []
  - name: Амбивалентный
    stress:
      - 8
    definition: >-
      Соединяющий противоположные чувства, оценки или побуждения по отношению к одному и тому же
      предмету. Амбивалентное отношение — это не отсутствие мнения, а одновременное «да» и «нет»
      внутри него.
    synonyms:
      - двойственный
      - неоднозначный
    antonyms: []
    relations: []
  - name: Амбидекстер
    stress:
      - 6
    definition: >-
      Человек, который одинаково уверенно пользуется правой и левой рукой. Это относится к
      двигательным навыкам и само по себе ничего не говорит о том, насколько у человека «развиты
      полушария» мозга.
    synonyms: []
    antonyms: []
    relations: []
  - name: Амикошонство
    stress:
      - 7
    definition: >-
      Нарочито фамильярное, бесцеремонное обращение под видом дружеской простоты. Так говорят, когда
      человек слишком быстро сокращает дистанцию и ведёт себя так, будто близость уже установлена.
    synonyms:
      - панибратство
      - фамильярность
    antonyms: []
    relations: []
  - name: Амперсанд
    stress:
      - 7
    definition: >-
      Типографский знак «&», обозначающий союз «и». Он вырос из слитного написания латинского et и
      сегодня особенно часто встречается в названиях, логотипах и технических обозначениях.
    synonyms: []
    antonyms: []
    relations: []
  - name: Амфиболичный
    stress:
      - 8
    definition: >-
      Допускающий два или несколько толкований из-за неясной конструкции или двусмысленного смысла.
      Амфиболичная фраза выглядит грамматически законченной, но оставляет сомнение, кто что сделал и
      к чему относится сказанное.
    synonyms:
      - двусмысленный
    antonyms:
      - однозначный
    relations:
      - word: Амфиболия
        type: related
  - name: Амфиболия
    stress:
      - 8
    definition: >-
      Двусмысленность высказывания, возникающая из-за его грамматического построения или неясной
      связи слов. Иногда её используют намеренно как приём, но чаще она просто мешает понять автора
      однозначно.
    synonyms:
      - двусмысленность
    antonyms:
      - однозначность
    relations:
      - word: Амфиболичный
        type: related
  - name: Анахронизм
    stress:
      - 8
    definition: >-
      Деталь, понятие или явление, оказавшееся не в своей исторической эпохе. В более широком смысле
      так называют что-то безнадёжно устаревшее и не соответствующее нынешнему времени.
    synonyms:
      - пережиток
    antonyms: []
    relations: []
  - name: Ангажированный
    stress:
      - 6
    definition: >-
      Несвободный в оценках из-за политических, деловых или личных обязательств и интересов.
      Ангажированный автор может выглядеть независимым, но его позиция заранее склоняется в нужную
      кому-то сторону.
    synonyms: []
    antonyms:
      - беспристрастный
    relations: []
  - name: Антагонист
    stress:
      - 8
    definition: >-
      Тот, кто активно противостоит другому участнику конфликта. В сюжете антагонист мешает
      протагонисту достичь цели, хотя вовсе не обязан быть злодеем.
    synonyms:
      - противник
    antonyms: []
    relations:
      - word: Протагонист
        type: opposite
  - name: Антология
    stress:
      - 6
    definition: >-
      Собрание избранных произведений разных авторов или одного автора, объединённых темой, жанром
      либо периодом. В антологию включают не всё подряд, а подборку, за которой стоит редакторский
      выбор.
    synonyms:
      - подборка
      - сборник
    antonyms: []
    relations: []
  - name: Апломб
    stress:
      - 4
    definition: >-
      Демонстративная уверенность в себе и собственной правоте. Апломб может выглядеть внушительно,
      но часто выдаёт самоуверенность, которой не хватает оснований.
    synonyms:
      - самоуверенность
    antonyms: []
    relations: []
  - name: Апология
    stress:
      - 5
    definition: >-
      Последовательная защита и оправдание идеи, учения, человека или явления. В современном
      употреблении слово нередко подразумевает не просто объяснение, а подчёркнуто горячую защиту.
    synonyms:
      - восхваление
      - защита
    antonyms: []
    relations: []
  - name: Апостериори
    stress:
      - 9
    definition: >-
      На основании опыта, наблюдений или уже полученных результатов. Это вывод после проверки
      фактами — в отличие от априорного предположения, сделанного заранее.
    synonyms: []
    antonyms:
      - априори
    relations:
      - word: Априори
        type: opposite
  - name: Априори
    stress:
      - 5
    definition: >-
      До опыта и независимо от проверки конкретными фактами. В обычной речи так говорят о выводе,
      который сделали заранее, исходя из общих предпосылок или уверенности говорящего.
    synonyms: []
    antonyms:
      - апостериори
    relations:
      - word: Апостериори
        type: opposite
  - name: Апроприация
    stress:
      - 8
    definition: >-
      Присвоение или освоение чего-либо, прежде принадлежавшего другому человеку, группе либо
      контексту. В искусстве и культуре термин особенно важен там, где заимствование чужих образов
      связано с вопросами авторства, власти и уважения к источнику.
    synonyms:
      - завладение
      - присвоение
    antonyms: []
    relations: []
  - name: Арго
    stress:
      - 4
    definition: >-
      Особая лексика замкнутой социальной или профессиональной группы, понятная прежде всего своим.
      Арго помогает узнавать «своих» и иногда намеренно скрывает смысл разговора от посторонних.
    synonyms:
      - жаргон
      - социальный диалект
    antonyms: []
    relations: []
  - name: Архаичный
    stress:
      - 5
    definition: >-
      Принадлежащий прошлой эпохе или сохраняющий заметно устаревшие черты. Архаичным может быть
      слово, обычай, устройство или манера поведения — всё, что выглядит пришедшим из другого
      времени.
    synonyms:
      - древний
      - устаревший
    antonyms:
      - современный
    relations: []
  - name: Архетип
    stress:
      - 6
    definition: >-
      Устойчивая исходная модель образа или сюжета, которая повторяется в разных культурах и
      произведениях. В аналитической психологии архетипами называют универсальные структуры
      коллективного бессознательного, проявляющиеся через символы и мотивы.
    synonyms:
      - первообраз
      - прообраз
    antonyms: []
    relations: []
  - name: Ассамблея
    stress:
      - 8
    definition: >-
      Собрание представителей, созванное для обсуждения и принятия решений. Словом называют как
      официальный орган, так и отдельную встречу его участников.
    synonyms:
      - собрание
    antonyms: []
    relations: []
  - name: Аутентичность
    stress:
      - 7
    definition: >-
      Подлинность и соответствие заявленному происхождению, характеру или внутренним убеждениям.
      Когда говорят об аутентичности человека, обычно имеют в виду согласованность его поведения с
      тем, кем он действительно себя считает.
    synonyms:
      - подлинность
    antonyms:
      - поддельность
    relations:
      - word: Аутентичный
        type: related
  - name: Аутентичный
    stress:
      - 7
    definition: >-
      Подлинный, соответствующий своему источнику, традиции или заявленной природе. Аутентичная вещь
      не просто похожа на оригинал — у неё есть основания считаться настоящей.
    synonyms:
      - настоящий
      - подлинный
    antonyms:
      - поддельный
    relations:
      - word: Аутентичность
        type: related
  - name: Аффирмация
    stress:
      - 7
    definition: >-
      Короткое утверждение, которое человек регулярно повторяет, чтобы закрепить желаемую установку
      или поддержать себя. Оно может помочь сосредоточиться на цели, но само по себе не заменяет
      действий, лечения или проверки реальностью.
    synonyms: []
    antonyms: []
    relations: []
  - name: Ахинея
    stress:
      - 5
    definition: >-
      Бессвязная, нелепая речь или откровенная бессмыслица. Так называют не просто ошибку, а
      высказывание, в котором трудно обнаружить разумную связь между частями.
    synonyms:
      - белиберда
      - бессмыслица
      - бред
    antonyms: []
    relations: []
