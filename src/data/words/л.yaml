letter: Л
words:
  - name: Лаг, временной лаг
    stress:
      - 2
      - 11
      - 14
    definition: >-
      Задержка между действием и ожидаемой реакцией или между двумя связанными событиями. Временной
      лаг особенно заметен в связи, управлении и экономике, где последствия решения проявляются не
      сразу.
    synonyms: []
    antonyms: []
    relations: []
  - name: Либерализм
    stress:
      - 8
    definition: >-
      Политическая и философская традиция, ставящая в центр свободу личности, равенство перед
      законом и защиту гражданских прав. Разные направления либерализма заметно расходятся в том,
      насколько активно государство должно вмешиваться в экономику и общественную жизнь.
    synonyms: []
    antonyms: []
    relations: []
  - name: Липофреник
    stress:
      - 7
    definition: >-
      Интернет-неологизм, которым называют человека, испытывающего беспричинную тоску или
      подавленность. В нормативных словарях и клинической терминологии слово не закреплено, поэтому
      принимать его за психологический диагноз не стоит.
    synonyms: []
    antonyms: []
    relations: []
  - name: Лоббирование
    stress:
      - 5
    definition: >-
      Организованное влияние на решения власти в интересах определённой группы, отрасли или
      организации. Лоббирование может быть законным и прозрачным, хотя в разговорной речи его
      нередко смешивают с подкупом и тайными договорённостями.
    synonyms: []
    antonyms: []
    relations: []
  - name: Люстрация
    stress:
      - 6
    definition: >-
      Законодательное ограничение доступа к государственным должностям для людей, связанных с
      прежним режимом или определёнными злоупотреблениями власти. Смысл и процедура люстрации
      различаются по странам и почти всегда вызывают споры о справедливости критериев.
    synonyms: []
    antonyms: []
    relations: []
